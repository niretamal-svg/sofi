version: '3.9'
services:
  api:
    build: ./api
    ports:
      - '3000:3000'
    env_file:
      - ./api/.env
    depends_on:
      - mongo
      - redis
    volumes:
      - ./api:/app
      - /app/node_modules

  web:
    build: ./web
    ports:
      - '5173:5173'
    env_file:
      - ./web/.env
    depends_on:
      - api
    volumes:
      - ./web:/app
      - /app/node_modules

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    ports:
      - '6379:6379'

volumes:
  mongo_data:
