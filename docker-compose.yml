version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sofi-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    networks:
      - sofi-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: sofi-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - sofi-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sofi-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sofi-network
    environment:
      - REACT_APP_API_URL=http://backend:8000

networks:
  sofi-network:
    driver: bridge

volumes:
  mongodb_data:
